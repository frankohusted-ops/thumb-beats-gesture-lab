<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mrbd-web-app-capable" content="yes"><title>Pocket Fairway</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#ecfff3;font:18px system-ui}main{max-width:600px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;color:#9ce4b4;font-size:13px;letter-spacing:2px}h1{font-size:28px;margin:12px 0}svg{width:100%;height:300px;border-radius:18px;background:#163d2a}#readout{display:flex;justify-content:space-between;margin:10px 0;font-size:18px}p{font-size:15px;color:#b3cbbd;line-height:1.5}button{font:16px system-ui;color:#edfff4;background:#214f36;border:2px solid #6ca37d;border-radius:10px;padding:9px;margin:3px}button:focus-visible{outline:3px solid #ffdc8d}meter{width:100%;height:24px}#message{min-height:28px;color:#ffdb94;font-size:21px}.buttons{display:flex;flex-wrap:wrap}</style></head><body><main><header><span>POCKET FAIRWAY</span><span>HOLE 1 · PAR 3</span></header><h1>A little golf. A little glory.</h1><svg viewBox="0 0 560 300" role="img" aria-label="Golf hole, tee on the left and flag on the right"><path d="M47 224Q126 96 275 135T500 77" stroke="#317951" stroke-width="92" fill="none" stroke-linecap="round"/><ellipse cx="480" cy="82" rx="58" ry="45" fill="#76aa60"/><ellipse cx="350" cy="190" rx="42" ry="22" fill="#d6bc7f"/><path d="M480 82V34l28 9-28 11" fill="#ffd67c" stroke="#ffe9b0" stroke-width="3"/><circle cx="480" cy="82" r="6" fill="#09251a"/><path id="trail" stroke="#e6ffb9" stroke-width="2" stroke-dasharray="4 5" fill="none"/><line id="aim" stroke="#ffdc8d" stroke-width="3" stroke-dasharray="6 5"/><circle id="ball" cx="65" cy="225" r="6" fill="white" stroke="#cde5d2" stroke-width="2"/></svg><div id="readout"><span id="club"></span><span id="distance"></span><span id="score"></span></div><div id="message">Aim, choose power, then pinch to hit.</div><meter id="meter" min="0" max="100" value="60"></meter><p id="power"></p><p>← → aim · ↑ ↓ adjust power · index pinch hits.<br>Club switches to putter near the flag. Pinch after finishing to replay.</p><div class="buttons"><button id="left">Aim left</button><button id="right">Aim right</button><button id="less">Less power</button><button id="more">More power</button><button id="hit">Hit</button><button id="restart">New round</button></div><p>Original arcade prototype · simplified physics · no wrist sensor required.</p></main><script>
'use strict';const $=id=>document.getElementById(id),hole={x:480,y:82};let ball={x:65,y:225},heading=0,power=60,strokes=0,moving=false,won=false,frame=null;
const distance=()=>Math.hypot(ball.x-hole.x,ball.y-hole.y);const putting=()=>distance()<75;const maxTravel=()=>putting()?85:300;
function aimAtHole(){heading=Math.atan2(hole.y-ball.y,hole.x-ball.x);}
function render(){$('ball').setAttribute('cx',ball.x);$('ball').setAttribute('cy',ball.y);$('aim').setAttribute('x1',ball.x);$('aim').setAttribute('y1',ball.y);$('aim').setAttribute('x2',ball.x+Math.cos(heading)*45);$('aim').setAttribute('y2',ball.y+Math.sin(heading)*45);$('aim').style.opacity=moving||won?0:1;$('club').textContent=putting()?'Putter':'Iron';$('distance').textContent=Math.round(distance()/2)+' yd';$('score').textContent=strokes+' strokes';$('meter').value=power;$('power').textContent='Power '+power+'% · estimated travel '+Math.round(maxTravel()*power/100/2)+' yd';}
function reset(){cancelAnimationFrame(frame);ball={x:65,y:225};power=60;strokes=0;moving=won=false;aimAtHole();$('trail').setAttribute('d','');$('message').textContent='Aim, choose power, then pinch to hit.';render();}
function hit(){if(moving)return;if(won){reset();return;}moving=true;strokes++;const start={...ball},range=maxTravel()*power/100,end={x:ball.x+Math.cos(heading)*range,y:ball.y+Math.sin(heading)*range},putt=putting();let began=null;const duration=putt?850:1300;$('message').textContent=putt?'Rolling…':'Ball in flight…';$('trail').setAttribute('d','M'+ball.x+' '+ball.y+'L'+end.x+' '+end.y);function tick(now){if(began===null)began=now;const t=Math.min(1,(now-began)/duration),e=1-(1-t)**2;ball={x:start.x+(end.x-start.x)*e,y:start.y+(end.y-start.y)*e};render();$('ball').setAttribute('r',putt?6:6+Math.sin(t*Math.PI)*4);if(distance()<8&&(putt||t>.85)){ball={...hole};won=true;moving=false;$('message').textContent='Holed in '+strokes+'! '+(strokes<=3?'Nicely played.':'One more round?');render();return;}if(t<1){frame=requestAnimationFrame(tick);return;}moving=false;if(ball.x<15||ball.x>545||ball.y<15||ball.y>285){ball=start;strokes++;$('message').textContent='Out of bounds. +1 penalty; try again.';}else if(((ball.x-350)/42)**2+((ball.y-190)/22)**2<1){$('message').textContent='In the sand. Next shot at 50% power.';power=50;}else $('message').textContent=putting()?'On the green. Line up your putt.':'Set up your next shot.';aimAtHole();render();}frame=requestAnimationFrame(tick);render();}
function control(key){if(key==='Escape'){reset();return;}if(moving)return;if(key==='Enter'){hit();return;}if(won)return;if(key==='ArrowLeft')heading-=.06;if(key==='ArrowRight')heading+=.06;if(key==='ArrowUp')power=Math.min(100,power+5);if(key==='ArrowDown')power=Math.max(5,power-5);render();}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape'].includes(e.key)){e.preventDefault();if(!e.repeat)control(e.key);}});for(const [id,key] of Object.entries({left:'ArrowLeft',right:'ArrowRight',less:'ArrowDown',more:'ArrowUp',hit:'Enter',restart:'Escape'}))$(id).onclick=()=>control(key);document.addEventListener('visibilitychange',()=>{if(document.hidden&&moving){cancelAnimationFrame(frame);moving=false;aimAtHole();$('message').textContent='Shot paused here when app was hidden.';render();}});reset();
</script></body></html>
