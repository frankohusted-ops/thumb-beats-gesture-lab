<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mrbd-web-app-capable" content="yes"><title>Thumb Beats • Gesture Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:18px system-ui,sans-serif}main{max-width:600px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;color:#8fffc9;font-weight:800;letter-spacing:2px}small{font-size:12px;letter-spacing:1px}h1{font-size:30px;margin:16px 0 4px}p{font-size:16px;margin:0 0 14px;color:#c8d6dd}button{background:#14221d;border:2px solid #45685a;border-radius:12px;color:white;font:700 18px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #8fffc9;outline-offset:2px}#start{width:100%;height:54px;background:#8fffc9;color:#001b10;border:0}.readout{display:grid;grid-template-columns:1fr 2fr 1fr;padding:16px 0;gap:8px}.readout div{display:flex;flex-direction:column}.readout strong{font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.readout label{font-size:11px;letter-spacing:1px;color:#9faeb7}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pads button{height:72px}.pads small{display:block;color:#b7c9c0;margin-top:6px}.pads .lit{background:#8fffc9;color:#001b10}.log{margin-top:16px;border-top:1px solid #33443d;padding-top:10px}.loghead{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;color:#8fffc9}pre{font:14px/1.5 ui-monospace,monospace;height:84px;overflow:hidden;margin:8px 0}footer{font-size:13px;line-height:1.5;color:#a3b5ac} @media(max-width:400px){main{padding:12px}header small{font-size:9px}.pads{gap:4px}.pads button{font-size:15px}}
</style></head><body><main><header><span>THUMB BEATS</span><small>GESTURE LAB / 01</small></header><section class="hero"><h1 id="headline">Find your rhythm.</h1><p id="status">Start, then try each finger against your thumb.</p></section><button id="start">Start sound + input test</button><section class="readout"><div><strong id="count">0</strong><label>HITS</label></div><div><strong id="last">—</strong><label>LAST INPUT</label></div><div><strong id="gap">—</strong><label>TAP GAP · MS</label></div></section><div class="pads"><button data-sound="kick">Kick<small>Enter / A</small></button><button data-sound="snare">Snare<small>↑ / S</small></button><button data-sound="hat">Hi-hat<small>↓ / D</small></button><button data-sound="tom">Tom<small>← → / F</small></button></div><section class="log"><div class="loghead">LIVE EVENT LOG <span id="audio">Audio off</span></div><pre id="events" aria-live="off">No events yet.</pre></section><footer>Test index → middle → ring → pinky, then slides.<br>Event names ≠ finger recognition. Escape pauses.</footer></main><script>'use strict';
const $=id=>document.getElementById(id);let ctx,active=false,count=0,lastTime=null,rows=[],noise;
const map={Enter:'kick',ArrowUp:'snare',ArrowDown:'hat',ArrowLeft:'tom',ArrowRight:'tom',a:'kick',s:'snare',d:'hat',f:'tom'};
function log(s){rows.unshift(`${(performance.now()/1000).toFixed(2)}  ${s}`);rows=rows.slice(0,30);$('events').textContent=rows.slice(0,4).join('\n');}
async function enable(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');if(!ctx){ctx=new AC({latencyHint:'interactive'});noise=ctx.createBuffer(1,ctx.sampleRate*.25,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}await ctx.resume();active=true;$('start').textContent='Pause test';$('headline').textContent='Listening for your taps.';$('status').textContent='Try fingers separately. Slides may send arrow events.';$('audio').textContent=`Audio ${ctx.state}`;log('Test started');}catch(e){$('audio').textContent='Audio unavailable';$('status').textContent=e.message+' — input logging still works.';active=true;$('start').textContent='Pause test';}}
function pause(){active=false;$('start').textContent='Resume test';$('headline').textContent='Test paused.';if(ctx)ctx.suspend();$('audio').textContent='Audio paused';}
function sound(kind){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime,g=ctx.createGain();g.connect(ctx.destination);let s;if(kind==='kick'||kind==='tom'){s=ctx.createOscillator();s.frequency.setValueAtTime(kind==='kick'?145:260,t);s.frequency.exponentialRampToValueAtTime(kind==='kick'?45:100,t+.13);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(g);}else{s=ctx.createBufferSource();s.buffer=noise;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=kind==='hat'?7000:1400;s.connect(f);f.connect(g);g.gain.setValueAtTime(kind==='hat'?.15:.3,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='hat'?.045:.15));}s.onended=()=>{s.disconnect();g.disconnect();};s.start(t);s.stop(t+.25);}
function hit(kind,event){const now=performance.now();$('gap').textContent=lastTime===null?'—':Math.round(now-lastTime);lastTime=now;$('count').textContent=++count;$('last').textContent=event;sound(kind);const b=document.querySelector(`[data-sound="${kind}"]`);b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),90);}
$('start').onclick=()=>active?pause():enable();
document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=async()=>{if(!active)await enable();log('click '+b.dataset.sound);hit(b.dataset.sound,'click');});
document.addEventListener('keydown',e=>{log('keydown '+e.key+(e.repeat?' [repeat]':''));if(!active)return;if(e.key==='Escape'){e.preventDefault();pause();$('start').focus();return;}if(map[e.key]){e.preventDefault();if(!e.repeat)hit(map[e.key],e.key);}});
document.addEventListener('keyup',e=>log('keyup '+e.key));
document.addEventListener('wheel',e=>{log(`wheel ${Math.round(e.deltaX)},${Math.round(e.deltaY)}`);if(active)$('last').textContent='wheel';},{passive:true});
document.addEventListener('pointerdown',e=>log('pointerdown '+e.pointerType));
document.addEventListener('pointerup',e=>log('pointerup '+e.pointerType));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
$('start').focus();
</script></body></html>
