<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mrbd-web-app-capable" content="yes"><title>Thumb Beats · Beat Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:18px system-ui}main{max-width:640px;padding:18px;margin:auto}header{color:#8fffc9;font-weight:800;display:flex;justify-content:space-between}small{font-size:12px}h1{font-size:28px;margin:12px 0}p{color:#c2cfc9;font-size:15px;line-height:1.5}button,a{font:inherit;color:white;background:#14221d;border:2px solid #365247;border-radius:7px;text-decoration:none}button{cursor:pointer}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.controls button{padding:8px;font-size:15px}.row{display:grid;grid-template-columns:55px repeat(16,1fr);gap:3px;align-items:center;margin:10px 0}.row b{font-size:13px}.step{height:42px;padding:0;font-size:10px}.step:nth-of-type(4n+1){border-left-color:#b7c9c0}.on{background:#63dca7;color:#001b10}.selected{outline:3px solid #fff;outline-offset:1px}.playing{box-shadow:inset 0 -7px #ffcb65}#selection{font-size:22px;font-weight:700;margin:14px 0}#state{color:#ffcb65}footer{display:flex;gap:12px;margin-top:18px}footer a{font-size:14px;padding:7px}@media(max-width:450px){main{padding:10px}.row{gap:2px;grid-template-columns:42px repeat(16,1fr)}.step{height:36px;font-size:8px}.row b{font-size:11px}}
</style></head><body><main><header>THUMB BEATS <small>BEAT BUILDER / 03</small></header><h1>Build your groove.</h1><p>← → move step · ↑ ↓ change drum · index pinch toggles a hit.<br>Slide up from Kick to reach Play and tempo controls.</p><div class="controls" id="controls"><button>Play</button><button>− Tempo</button><button>+ Tempo</button><button>Starter</button><button>Clear</button></div><div id="state">Stopped · 100 BPM</div><div id="grid" aria-label="16-step drum sequencer"></div><div id="selection"></div><p id="notice">One bar · 16 steps · edits save on this device.</p><footer><a href="slides.html">Slide drums</a><a href="contact.html">Contact test</a><a href="wrist.html">Wrist select</a></footer></main><script>
'use strict';
const names=['Kick','Snare','Hi-hat','Tom'],$=id=>document.getElementById(id);
const starter=()=>[Array.from({length:16},(_,i)=>i===0||i===8),Array.from({length:16},(_,i)=>i===4||i===12),Array.from({length:16},(_,i)=>i%2===0),Array(16).fill(false)];
let pattern=starter(),bpm=100,row=0,col=0,control=0,playing=false,starting=false,token=0,ctx,noise,master,timer,frame,nextTime=0,nextStep=0,queue=[],playhead=-1;
try{const s=JSON.parse(localStorage.getItem('thumb-beats-builder-v1'));if(s&&s.pattern?.length===4&&s.pattern.every(r=>r.length===16&&r.every(v=>typeof v==='boolean'))){pattern=s.pattern;bpm=Number.isFinite(s.bpm)?Math.max(50,Math.min(180,s.bpm)):100;}}catch{}
function save(){try{localStorage.setItem('thumb-beats-builder-v1',JSON.stringify({pattern,bpm}));}catch{$('notice').textContent='Storage unavailable; keep this page open to retain edits.';}}
const cells=[];for(let r=0;r<4;r++){const line=document.createElement('div');line.className='row';const label=document.createElement('b');label.textContent=names[r];line.append(label);cells[r]=[];for(let c=0;c<16;c++){const b=document.createElement('button');b.className='step';b.textContent=c+1;b.onclick=()=>{row=r;col=c;toggle();};line.append(b);cells[r][c]=b;}$('grid').append(line);}
const controls=Array.from($('controls').children);
function render(){for(let r=0;r<4;r++)for(let c=0;c<16;c++){const b=cells[r][c];b.classList.toggle('on',pattern[r][c]);b.classList.toggle('selected',row===r&&col===c);b.classList.toggle('playing',playhead===c);b.setAttribute('aria-pressed',String(pattern[r][c]));b.setAttribute('aria-label',names[r]+' step '+(c+1));}controls.forEach((b,i)=>b.classList.toggle('selected',row===-1&&control===i));controls[0].textContent=playing?'Stop':'Play';$('state').textContent=(playing?'Playing':'Stopped')+' · '+bpm+' BPM';$('selection').textContent=row===-1?'Controls · '+controls[control].textContent:names[row]+' · Step '+(col+1)+' · '+(pattern[row][col]?'ON':'OFF');}
function toggle(){pattern[row][col]=!pattern[row][col];save();render();}
function voice(r,t){const g=ctx.createGain();g.connect(master);let s,f;if(r===0||r===3){s=ctx.createOscillator();s.frequency.setValueAtTime(r===0?145:260,t);s.frequency.exponentialRampToValueAtTime(r===0?45:100,t+.13);g.gain.setValueAtTime(.38,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(g);}else{s=ctx.createBufferSource();s.buffer=noise;f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=r===2?7000:1400;s.connect(f);f.connect(g);g.gain.setValueAtTime(r===2?.12:.25,t);g.gain.exponentialRampToValueAtTime(.001,t+(r===2?.045:.15));}s.onended=()=>{s.disconnect();g.disconnect();if(f)f.disconnect();};s.start(t);s.stop(t+.25);}
function schedule(){if(!playing)return;if(nextTime<ctx.currentTime-.1){nextTime=ctx.currentTime+.02;queue=[];}while(nextTime<ctx.currentTime+.1){for(let r=0;r<4;r++)if(pattern[r][nextStep])voice(r,nextTime);queue.push({time:nextTime,step:nextStep});nextStep=(nextStep+1)%16;nextTime+=60/bpm/4;}}
function animate(){if(!playing)return;let changed=false;while(queue.length&&queue[0].time<=ctx.currentTime){playhead=queue.shift().step;changed=true;}if(changed)render();frame=requestAnimationFrame(animate);}
function stop(){token++;starting=false;playing=false;clearInterval(timer);cancelAnimationFrame(frame);queue=[];playhead=-1;if(master){master.gain.setValueAtTime(0,ctx.currentTime);master.disconnect();master=null;}if(ctx)ctx.suspend();render();}
async function play(){if(playing){stop();return;}if(starting)return;starting=true;const ticket=++token;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio unavailable');if(!ctx){ctx=new AC({latencyHint:'interactive'});noise=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.25),ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}await ctx.resume();if(ticket!==token)return;master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination);playing=true;nextStep=0;nextTime=ctx.currentTime+.05;queue=[];schedule();timer=setInterval(schedule,25);animate();render();}catch(e){$('notice').textContent=e.message;}finally{if(ticket===token)starting=false;}}
function action(i){if(i===0)play();if(i===1||i===2){bpm=Math.max(50,Math.min(180,bpm+(i===1?-5:5)));save();}if(i===3){pattern=starter();save();}if(i===4){pattern=Array.from({length:4},()=>Array(16).fill(false));save();}render();}
controls.forEach((b,i)=>b.onclick=()=>{row=-1;control=i;action(i);});
document.addEventListener('keydown',e=>{if(e.target.closest('a'))return;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape',' '].includes(e.key))return;e.preventDefault();if(e.repeat)return;if(e.key==='Escape'){stop();row=-1;control=0;}else if(e.key===' '){play();}else if(e.key==='Enter'){if(row===-1)action(control);else toggle();}else if(e.key==='ArrowUp')row=Math.max(-1,row-1);else if(e.key==='ArrowDown')row=Math.min(3,row+1);else if(row===-1)control=(control+(e.key==='ArrowLeft'?-1:1)+5)%5;else col=(col+(e.key==='ArrowLeft'?-1:1)+16)%16;render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);render();
</script></body></html>
