<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mrbd-web-app-capable" content="yes"><title>Marmalade · Your little tabby</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#ffe5b8;font:18px system-ui}main{max-width:600px;margin:auto;padding:18px;text-align:center}header{display:flex;justify-content:space-between;font-size:13px;letter-spacing:2px;color:#d4a875}h1{font-size:30px;margin:15px 0 4px}p{font-size:16px;color:#d8c4a9;margin:8px}svg{width:100%;height:300px;overflow:visible}.fur{fill:#ed963f;stroke:#8c471e;stroke-width:4;stroke-linejoin:round}.stripe{fill:none;stroke:#ac571f;stroke-width:10;stroke-linecap:round}#cat{transform-origin:300px 240px;animation:breathe 4s ease-in-out infinite}#tail{transform-origin:410px 210px;animation:tail 5s ease-in-out infinite}#head{transform-origin:185px 180px}.pet #head{animation:nuzzle 1s ease-in-out}.pet #body{animation:arch 1s ease-in-out}.pet #stroke{animation:stroke 1s ease-out}.scratch #head{animation:nuzzle .55s ease-in-out 2}.eyes{transform-origin:170px 137px;animation:blink 7s infinite}.sleep .eyes{transform:scaleY(.12);animation:none}.sleep #cat{animation:breathe 5s ease-in-out infinite}#stroke{opacity:0;fill:none;stroke:#fff0ba;stroke-width:7;stroke-linecap:round;stroke-dasharray:38 270}#heart{opacity:0;fill:#ffbd8a}.pet #heart,.scratch #heart{animation:heart 1.3s ease-out}button{padding:11px 18px;background:#342115;color:#ffe5b8;border:1px solid #a36a37;border-radius:20px;font:16px system-ui;margin:5px;cursor:pointer}button:focus-visible{outline:3px solid #ffe5b8}#mood{min-height:26px;font-size:21px}#hint{font-size:13px;color:#ae9375}@keyframes breathe{50%{transform:scaleY(1.025)}}@keyframes tail{50%{transform:rotate(-8deg)}}@keyframes nuzzle{50%{transform:rotate(-9deg) translateY(-5px)}}@keyframes arch{50%{transform:translateY(-9px) scaleY(1.035)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@keyframes stroke{0%{opacity:0;stroke-dashoffset:0}15%{opacity:1}85%{opacity:1}100%{opacity:0;stroke-dashoffset:-265}}@keyframes heart{20%{opacity:1}100%{opacity:0;transform:translateY(-35px)}}
</style></head><body><main><header><span>POCKET COMPANION</span><span>01</span></header><h1>Marmalade</h1><p>A little warmth, right here.</p><svg viewBox="0 0 560 300" role="img" aria-label="An orange tabby cat, head on the left and tail on the right"><ellipse cx="290" cy="261" rx="193" ry="16" fill="#26190f"/><g id="cat"><path id="tail" class="fur" d="M405 217 Q500 230 494 157 Q486 112 464 133 Q449 144 466 163 Q482 202 412 189Z"/><g id="body"><ellipse class="fur" cx="313" cy="197" rx="124" ry="66"/><path class="stripe" d="M272 137l9 30m30-34 2 30m29-27-4 31m31-18-7 30"/><ellipse class="fur" cx="239" cy="248" rx="42" ry="15"/><ellipse class="fur" cx="376" cy="247" rx="43" ry="16"/></g><g id="head"><path class="fur" d="M120 124L113 64 153 91Q176 83 196 94L235 66 228 128Q246 169 216 194Q173 218 133 190Q108 171 120 124Z"/><path d="M124 82l5 34 19-17m73-17-24 20 18 15" fill="#eeb0a0"/><path class="stripe" d="M157 94l9 19 9-19 10 19 10-17M120 144l20 6m-17 14 17 0m88-19-21 7m17 13-18 0"/><g class="eyes" fill="#392817"><ellipse cx="151" cy="137" rx="7" ry="9"/><ellipse cx="199" cy="137" rx="7" ry="9"/></g><ellipse cx="174" cy="170" rx="28" ry="19" fill="#ffe1b2"/><path d="M165 158h18l-9 10Z" fill="#a86458"/><path d="M174 167v9m0 0q-9 10-17 0m17 0q9 10 17 0" fill="none" stroke="#6b3c25" stroke-width="3"/><path d="M139 167l-42-7m42 16-42 8m110-17 41-7m-40 17 40 8" stroke="#e5bf85" stroke-width="2"/></g></g><path id="stroke" d="M137 77 Q220 96 255 113 Q353 102 421 154"/><path id="heart" d="M264 70c-25-20-28 12 0 26 28-14 25-46 0-26"/></svg><div id="mood" aria-live="polite">He's happy to see you.</div><p>Swipe right to pet · index pinch to scratch</p><button id="pet">Pet him →</button><button id="scratch">Head scratch</button><button id="sound">Purr sound: off</button><p id="hint">Sound is optional. He'll get sleepy when you leave him to rest.</p></main><script>
'use strict';const $=id=>document.getElementById(id);let ctx,volume,oscillators=[],soundOn=false,count=0,animationTimer,idleTimer,lastPet=0;
function rest(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{document.body.classList.remove('pet','scratch');document.body.classList.add('sleep');$('mood').textContent='A tiny nap. A very big purr.';},30000);}
function purr(){if(!soundOn||!ctx||ctx.state!=='running')return;const t=ctx.currentTime;volume.gain.cancelScheduledValues(t);volume.gain.setValueAtTime(.015,t);volume.gain.linearRampToValueAtTime(.055,t+.15);volume.gain.exponentialRampToValueAtTime(.0001,t+2);}
async function toggleSound(){soundOn=!soundOn;try{if(soundOn){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});volume=ctx.createGain();volume.gain.value=0;volume.connect(ctx.destination);const carrier=ctx.createOscillator(),pulse=ctx.createOscillator(),depth=ctx.createGain();carrier.type='triangle';carrier.frequency.value=78;pulse.frequency.value=25;depth.gain.value=.25;const tremolo=ctx.createGain();tremolo.gain.value=.6;pulse.connect(depth);depth.connect(tremolo.gain);carrier.connect(tremolo);tremolo.connect(volume);carrier.start();pulse.start();oscillators=[carrier,pulse];}await ctx.resume();purr();}else if(ctx)await ctx.suspend();}catch{soundOn=false;$('hint').textContent='Audio unavailable here. Petting still works.';}$('sound').textContent='Purr sound: '+(soundOn?'on':'off');}
function touch(kind){clearTimeout(animationTimer);document.body.classList.remove('pet','scratch','sleep');void document.body.offsetWidth;document.body.classList.add(kind);count++;lastPet=Date.now();const messages=kind==='scratch'?["That's the spot.",'Slow blinks. You have been chosen.','He leans into your hand.']:['Purrrrr.','A happy little back arch.','More of that, please.','Your hand has been claimed.'];$('mood').textContent=messages[(count-1)%messages.length];purr();animationTimer=setTimeout(()=>document.body.classList.remove(kind),1300);rest();}
$('pet').onclick=()=>touch('pet');$('scratch').onclick=()=>touch('scratch');$('sound').onclick=toggleSound;
document.addEventListener('keydown',e=>{if(!['ArrowRight','Enter','ArrowUp','Escape'].includes(e.key))return;if(e.key==='Enter'&&e.target.closest('button'))return;e.preventDefault();if(e.repeat)return;if(e.key==='ArrowRight')touch('pet');if(e.key==='Enter')touch('scratch');if(e.key==='ArrowUp')toggleSound();if(e.key==='Escape'&&soundOn)toggleSound();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(idleTimer);if(ctx)ctx.suspend();soundOn=false;$('sound').textContent='Purr sound: off';}else rest();});rest();
</script></body></html>
