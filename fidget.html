<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mrbd-web-app-capable" content="yes"><title>Pocket Fidgets</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#e8fff5;font:18px system-ui}main{width:min(100%,600px);margin:auto;padding:18px;text-align:center}header{display:flex;justify-content:space-between;color:#8de4c0;font-size:13px;letter-spacing:2px}h1{margin:16px 0 8px;font-size:30px}p{color:#b3c7bf;font-size:15px;line-height:1.4}nav{display:flex;gap:8px;justify-content:center;margin:12px 0}button{background:#152b23;border:2px solid #375e4d;border-radius:14px;color:inherit;font:inherit;padding:10px;cursor:pointer}button:focus-visible,.selected{outline:3px solid #ffdc92;outline-offset:3px}.active{background:#285b46}#stage{height:280px;display:flex;align-items:center;justify-content:center}#bubbles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:360px;max-width:92%}.bubble{width:100%;aspect-ratio:1;border-radius:50%;padding:0;background:radial-gradient(circle at 33% 28%,#dcfff1,#72d9b2 22%,#1b654b 65%,#0a3023);box-shadow:inset 0 0 10px #99f5cf55;color:#eafff4}.bubble.popped{background:#10221c;box-shadow:inset 0 3px 8px #000;color:#526b60;border-color:#284538}.bubble.pop{animation:pop .2s}#spinner{width:240px;height:240px}#rotor{transform-origin:120px 120px}#zipper{width:180px;height:260px}#status{font-size:21px;min-height:29px;color:#ffe0a2}#help{min-height:43px}footer{font-size:12px;color:#8ba497;margin-top:12px}[hidden]{display:none!important}@keyframes pop{50%{transform:scale(.8)}}
</style></head><body><main><header><span>POCKET FIDGETS</span><span>01</span></header><h1 id="title">Bubble wrap</h1><nav id="tabs" aria-label="Choose toy"><button>Bubble wrap</button><button>Spinner</button><button>Zipper</button></nav><div id="stage"><div id="bubbles" aria-label="Bubble wrap"></div><svg id="spinner" hidden viewBox="0 0 240 240" role="img" aria-label="Three-lobed fidget spinner"><g id="rotor"><path d="M105 112Q50 80 89 37Q125 7 146 48Q157 73 132 109Q198 77 216 128Q226 178 181 183Q151 184 124 135Q128 204 76 211Q28 204 36 161Q43 135 105 112" fill="#75d7b1" stroke="#b4ffe1" stroke-width="4"/><circle cx="118" cy="55" r="20" fill="#132b23"/><circle cx="185" cy="149" r="20" fill="#132b23"/><circle cx="73" cy="177" r="20" fill="#132b23"/></g><circle cx="120" cy="120" r="25" fill="#ffdd99"/><circle cx="120" cy="120" r="12" fill="#6e5630"/></svg><svg id="zipper" hidden viewBox="0 0 180 260" role="img" aria-label="Zipper with movable pull"><path d="M65 20V240M115 20V240" stroke="#33694f" stroke-width="32"/><path d="M78 20V240M102 20V240" stroke="#ebc987" stroke-width="12" stroke-dasharray="6 6"/><path id="opening" d="M90 20V20" stroke="#000" stroke-width="30"/><g id="pull"><rect x="69" y="12" width="42" height="32" rx="9" fill="#ffe0a2"/><rect x="80" y="31" width="20" height="49" rx="8" fill="#d2ae6a" stroke="#fff0cd" stroke-width="3"/><rect x="86" y="41" width="8" height="22" rx="3" fill="#172b22"/></g></svg></div><div id="status" aria-live="polite"></div><p id="help"></p><button id="reset">Fresh sheet</button><p>Slide up from the top row to choose a toy.<br>In the toy menu: ← → choose · pinch or ↓ enter.</p><footer>Discrete swipes control each action. Sound-free, no account needed.</footer></main><script>
'use strict';const $=id=>document.getElementById(id),names=['Bubble wrap','Spinner','Zipper'];let toy=0,menu=false,pos=0,popped=Array(15).fill(false),zip=0,angle=0,speed=0,frame=null,last=0;const tabs=Array.from($('tabs').children),cells=[];
for(let i=0;i<15;i++){const b=document.createElement('button');b.className='bubble';b.textContent='•';b.setAttribute('aria-label','Bubble '+(i+1));b.onclick=()=>{menu=false;pos=i;pop();};$('bubbles').append(b);cells.push(b);}
function render(){tabs.forEach((b,i)=>{b.classList.toggle('active',i===toy);b.classList.toggle('selected',menu&&i===toy);b.setAttribute('aria-pressed',String(i===toy));});$('title').textContent=names[toy];['bubbles','spinner','zipper'].forEach((id,i)=>$(id).hidden=i!==toy);cells.forEach((b,i)=>{b.classList.toggle('popped',popped[i]);b.classList.toggle('selected',!menu&&i===pos);b.setAttribute('aria-pressed',String(popped[i]));b.textContent=popped[i]?'·':'•';});$('reset').textContent=['Fresh sheet','Stop spinner','Close zipper'][toy];$('status').textContent=menu?'Choose toy · '+names[toy]:toy===0?popped.filter(Boolean).length+' / 15 popped':toy===1?(Math.abs(speed)>5?'Spinning…':'Ready for a flick'):Math.round(zip*100)+'% open';$('help').textContent=menu?'← → choose a toy · pinch or ↓ to play':toy===0?'Swipe to select a bubble · pinch to pop.':toy===1?'← → flick · pinch to brake · ↑ toy menu.':'← closes · → opens · pinch toggles · ↑ toy menu.';$('opening').setAttribute('d','M90 20V'+(20+zip*185));$('pull').setAttribute('transform','translate(0 '+zip*185+')');}
function stop(){cancelAnimationFrame(frame);frame=null;speed=0;last=0;render();}
function select(i){stop();toy=i;menu=true;render();}
function pop(){if(!popped[pos]){popped[pos]=true;const b=cells[pos];b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}render();if(popped.every(Boolean))$('status').textContent='All popped! Pinch again for a fresh sheet.';}
function animate(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;angle=(angle+speed*dt)%360;speed*=Math.exp(-.55*dt);$('rotor').style.transform='rotate('+angle+'deg)';if(Math.abs(speed)<5){stop();return;}frame=requestAnimationFrame(animate);}
function flick(direction){speed=Math.max(-1800,Math.min(1800,speed+direction*650));if(frame===null){last=0;frame=requestAnimationFrame(animate);}render();}
function reset(){if(toy===0)popped.fill(false);if(toy===1)stop();if(toy===2)zip=0;render();}
function enter(){if(menu){menu=false;render();return;}if(toy===0){if(popped.every(Boolean))reset();else pop();}if(toy===1)stop();if(toy===2){zip=zip>=.5?0:1;render();}}
tabs.forEach((b,i)=>b.onclick=()=>{select(i);menu=false;render();});$('reset').onclick=reset;
document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape'].includes(e.key))return;e.preventDefault();if(e.repeat)return;if(e.key==='Escape'){stop();menu=true;}else if(e.key==='Enter')enter();else if(menu){if(e.key==='ArrowLeft')select((toy+2)%3);if(e.key==='ArrowRight')select((toy+1)%3);if(e.key==='ArrowDown'){menu=false;}}else if(toy===0){if(e.key==='ArrowUp'){if(pos<5)menu=true;else pos-=5;}if(e.key==='ArrowDown')pos=Math.min(14,pos+5);if(e.key==='ArrowLeft')pos=(pos+14)%15;if(e.key==='ArrowRight')pos=(pos+1)%15;}else if(e.key==='ArrowUp'){stop();menu=true;}else if(toy===1){if(e.key==='ArrowLeft')flick(-1);if(e.key==='ArrowRight')flick(1);}else{if(e.key==='ArrowLeft')zip=Math.max(0,zip-.1);if(e.key==='ArrowRight')zip=Math.min(1,zip+.1);}render();if(toy===0&&!menu&&popped.every(Boolean))$('status').textContent='All popped! Pinch again for a fresh sheet.';});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);render();
</script></body></html>
